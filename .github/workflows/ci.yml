name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mediaportfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__DefaultConnection: "Host=localhost;Database=mediaportfolio_test;Username=postgres;Password=postgres"
      JwtSettings__Secret: "CI_TEST_SECRET_KEY_1234567890_ABCDEFGHIJ"
      JwtSettings__Issuer: "SaininMedia"
      JwtSettings__Audience: "SaininMediaAdmin"
      JwtSettings__ExpirationMinutes: "60"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run Migrations
        run: dotnet ef database update
          --project src/MediaPortfolio.Infrastructure/MediaPortfolio.Infrastructure.csproj
          --startup-project src/MediaPortfolio.API/MediaPortfolio.API.csproj

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.xml"
          if-no-files-found: ignore
